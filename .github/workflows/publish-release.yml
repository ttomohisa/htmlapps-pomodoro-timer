name: Publish release after merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pomodoro-main-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ttomohisa/htmlapps-pomodoro-timer'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build and run regression tests before releasing
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Tag version and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string](Get-Content -Raw -Encoding UTF8 'app.config.json' | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "app.config.json has an invalid stable SemVer version: $version"
          }
          $tag = "v$version"

          & git fetch origin --tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch repository tags.' }
          $remoteHead = & git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0 -or -not $remoteHead) { throw 'Could not check the latest main head.' }
          $latestMainSha = ($remoteHead -split '\s+')[0]
          if ($latestMainSha -ne $env:GITHUB_SHA) {
            Write-Host 'A newer main commit exists. Skipping release of the previous commit.'
            exit 0
          }

          $existingTag = & git tag --list $tag
          if ($existingTag) {
            $tagSha = (& git rev-list -n 1 $tag).Trim()
            if ($tagSha -ne $env:GITHUB_SHA) {
              Write-Host "$tag was already published for $tagSha. Bump app.config.json to release a new version."
              exit 0
            }
          } else {
            $previousTag = & git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
              Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
              Select-Object -First 1
            if ($previousTag -and ([version]$version -le [version]($previousTag.Substring(1)))) {
              throw "New version $version must be greater than existing $previousTag."
            }

            & git config user.name 'github-actions[bot]'
            & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            & git tag -a $tag -m "Release $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release tag.' }
            & git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push release tag.' }
          }

          & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "GitHub Release $tag already exists. Nothing to do."
            exit 0
          }

          & gh release create $tag 'pomodoro-timer.html#pomodoro-timer.html' 'dist/index.self-extract.html#pomodoro-timer-self-extract.html' --repo $env:GITHUB_REPOSITORY --title $tag --target $env:GITHUB_SHA --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release $tag." }
