name: Temporary regenerate Pomodoro HTML
on:
  push:
    branches:
      - fix/pomodoro-reliability-20261120

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Regenerate and verify all portable files
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Commit generated files into the PR branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/index.html dist/index.self-extract.html dist/dependency-manifest.json dist/self-extract-manifest.json pomodoro-timer.html
          if (git diff --cached --quiet) {
            Write-Host "Generated artifacts already synchronized."
            exit 0
          }
          git commit -m "chore: rebuild v1.0.5 portable HTML [skip ci]"
          git push origin "HEAD:fix/pomodoro-reliability-20261120"
