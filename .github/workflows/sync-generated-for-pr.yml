name: Temporary sync generated Pomodoro files
on:
  push:
    branches:
      - fix/pomodoro-reliability-20261120

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build and validate all standalone artifacts
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Commit generated artifacts to fix branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/index.html dist/index.self-extract.html dist/dependency-manifest.json dist/self-extract-manifest.json pomodoro-timer.html
          if (git diff --cached --quiet) {
            Write-Host "Generated artifacts already synchronized."
            exit 0
          }
          git commit -m "chore: regenerate standalone artifacts [skip ci]"
          git push origin "HEAD:fix/pomodoro-reliability-20261120"
